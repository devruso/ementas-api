services:
    api:
        build: .
        restart: unless-stopped
        ports:
            - 3333:3333
        volumes:
            - api_storage:/app/storage
        env_file:
            - ./.env
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
        depends_on:
            - postgres
    app:
        image: ementas-app
        restart: unless-stopped
        build:
            context: ../ementas-app
            args:
                API_URL: http://localhost:3333/api
        ports:
            - 3000:8080
        depends_on:
            - api
    postgres:
        image: postgres:16
        restart: unless-stopped
        ports:
            - 15432:5432
        environment:
            POSTGRES_PASSWORD: supersecret
            POSTGRES_USER: admin
            POSTGRES_DB: ementas
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
    api_storage:


